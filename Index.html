    <script nonce="5f+66wCeqDuDwZEEiby6XQ==">
    const isLoggedIn = false;
    const csrf = "d3c897d15c9c2518731adc02df6fa267d5472bfb152d5c547c37865f39c81b87";
    const accountType = "free";
    const accountRole = "member";
    const username = "";
    const displayName = "";
    let defaultAvatar = "";
    let activeAim = "" || null;
    if (activeAim) localStorage.setItem('sol_active_aim', activeAim);
    else localStorage.removeItem('sol_active_aim');

    window.solBrightness = localStorage.getItem('sol_brightness') || 100;
    window.solNeon = localStorage.getItem('sol_neon') || 100;
    window.solSpeed = localStorage.getItem('sol_speed') || 5;
    window.solPrimaryColor = localStorage.getItem('sol_primary') || '#ff3333';
    window.solSecondaryColor = localStorage.getItem('sol_secondary') || '#1a1a1a';

    document.body.style.filter = `brightness(${window.solBrightness}%)`;
    document.documentElement.style.setProperty('--neon-scale', window.solNeon / 100);
    document.documentElement.style.setProperty('--neon-speed', window.solSpeed + 's');
    document.documentElement.style.setProperty('--cyan', window.solPrimaryColor);
    document.documentElement.style.setProperty('--purp', window.solSecondaryColor);

    let solDeviceId = localStorage.getItem('sol_device_id');
    if (!solDeviceId) {
        solDeviceId = 'DEV-' + Math.random().toString(36).substr(2, 10) + '-' + Date.now();
        localStorage.setItem('sol_device_id', solDeviceId);
    }
    let clientDevice = (function() {
        const ua = navigator.userAgent;
        let osVer = '';
        const iosMatch = ua.match(/OS (\d+[_.]\d+)/);
        if (iosMatch) osVer = ' iOS ' + iosMatch[1].replace('_', '.');
        if (/iPhone/.test(ua)) { return 'iPhone' + osVer; }
        if (/Android/.test(ua)) { const m = ua.match(/Android.*?; (.*?) Build/); return m ? m[1].trim() : 'Android'; }
        if (/Windows NT/.test(ua)) return 'Windows PC';
        return 'Thiết bị Web';
    })();

    let clientIP = 'Đang lấy...';
    fetch('https://api.ipify.org?format=json')
        .then(r=>r.json()).then(d=>{ clientIP = d.ip; document.querySelectorAll('.live-ip-display').forEach(e=>e.innerText=clientIP); })
        .catch(e=>{ clientIP='Lỗi API'; });

    const dict = {
        vi: { 
            tab_login:"Đăng nhập", tab_getkey:"Tài khoản Free", tab_video:"Hướng Dẫn", 
            tab_aim:"Aimbot", tab_acc:"Tài khoản", tab_buyproxy:"Mua Proxy VIP",
            login_title:"ĐĂNG NHẬP", user_ph:"Tài khoản...", pass_ph:"Mật khẩu...", btn_confirm:"XÁC NHẬN" 
        },
        en: { 
            tab_login:"Login", tab_getkey:"Free Account", tab_video:"Tutorial", 
            tab_aim:"Aimbot", tab_acc:"Account", tab_buyproxy:"Buy Proxy VIP",
            login_title:"LOGIN", user_ph:"Username...", pass_ph:"Password...", btn_confirm:"CONFIRM" 
        }
    };
    let curLang = localStorage.getItem('sol_lang') || 'vi';
    function t(k){ return dict[curLang][k] || k; }
    document.getElementById('langToggle').onclick = ()=>{
        curLang = curLang==='vi'?'en':'vi';
        localStorage.setItem('sol_lang', curLang);
        document.getElementById('langToggle').innerText = curLang.toUpperCase();
        if(document.getElementById('gameModalOverlay').classList.contains('active')){ renderUserBar(); switchTab(currentTab); }
    };
    document.getElementById('langToggle').innerText = curLang.toUpperCase();

    function handleKick(){
        if(window.isKickedOut)return;
        window.isKickedOut=true;
        localStorage.removeItem('sol_active_aim'); localStorage.removeItem('sol_free_expire');
        Swal.fire({ html:'...', background:'rgba(5,2,10,0.98)', customClass:{popup:'swal-sol-popup swal-sol-kick',confirmButton:'sol-btn-kick'} }).then(()=>location.reload());
    }

    async function handleLogout(){
        const fd = new URLSearchParams();
        fd.append('action','logout');
        fd.append('csrf_token', csrf);
        await fetch('', {method:'POST', body: fd});
        location.reload();
    }

    const overlay = document.getElementById('gameModalOverlay');
    const contentDiv = document.getElementById('gameContent');
    let currentTab = isLoggedIn ? 'aim' : 'login';
    document.getElementById('settingBtn').onclick = ()=>{ overlay.classList.add('active'); renderUserBar(); switchTab(currentTab); };
    document.getElementById('modalCloseBtn').onclick = ()=> overlay.classList.remove('active');
    overlay.addEventListener('click', e=>{ if(e.target===overlay) overlay.classList.remove('active'); });

    function renderUserBar(){
        if(isLoggedIn){
            document.getElementById('sidebarMenu').innerHTML = `
                <img src="${defaultAvatar}" class="user-avatar-mini" id="miniAvatar" title="Đổi Avatar">
                <span class="user-name-mini">${displayName}</span>
                <div class="mini-tabs">
                    <button class="mini-tab ${currentTab==='aim'?'active':''}" data-tab="aim"><i class="fas fa-crosshairs"></i> ${t('tab_aim')}</button>
                    <button class="mini-tab ${currentTab==='account'?'active':''}" data-tab="account"><i class="fas fa-user-astronaut"></i> ${t('tab_acc')}</button>
                    <button class="mini-tab ${currentTab==='settings'?'active':''}" data-tab="settings"><i class="fas fa-cog"></i> Cài Đặt Giao Diện</button>
                    <button class="mini-tab ${currentTab==='buyproxy'?'active':''}" data-tab="buyproxy"><i class="fas fa-shopping-cart"></i> ${t('tab_buyproxy')}</button>

            switchTab(currentTab);

    function renderAimItem(id, name){
        let isChecked = activeAim === id;
        let isDisabled = activeAim !== null && activeAim !== id;
        let activeText = isChecked ? '<span style="color:var(--ff-orange); font-size:10px; font-weight:900; margin-right:8px; text-shadow:0 0 15px var(--ff-orange);">KÍCH HOẠT</span>' : '';

                <label class="switch"><input type="checkbox" class="aim-switch-input" data-id="${id}" ${isChecked?'checked':''} ${isDisabled?'disabled':''}><span class="slider"></span></label>
            </div>
        </div>`;

        let html='';
        if(!isLoggedIn){
            if(tab==='login'){
                html=`<div style="width:100%;max-width:260px;margin:20px auto;text-align:center;">

                        <button type="submit" class="game-btn" style="margin-top:10px;">${t('btn_confirm')}</button>
                    </form></div>`;
            } else if(tab==='getkey'){
                html=`<div style="text-align:center;padding:40px 10px;"><a href="http://solitudepremium.click/kzmod/key.php" target="_blank" class="game-btn" style="background: linear-gradient(135deg, #059669, #10b981); display:inline-block; text-decoration:none; box-shadow:0 0 30px rgba(16,185,129,0.8);"><i class="fas fa-key"></i> Get Tài Khoản Free 12h</a></div>`;

                        <span style="font-size:12px;font-weight:800;color:var(--cyan);text-shadow:0 0 15px var(--cyan);display:flex;align-items:center;gap:6px;">
                            <i class="fas fa-server"></i> Máy chủ: <span id="serverHostname" style="color:var(--cyan);margin-left:4px;cursor:pointer;text-decoration:underline;">solitudeteam.duckdns.org</span>

                    ${renderAimItem('aim_antena','Aim Antena')}
                    ${renderAimItem('no_antena','Aim No Antena')}
                    ${renderAimItem('aim_body_antena','Aim Body No Antena')}
                    ${renderAimItem('server_aimco','Aim Server 2019')}
                    ${renderAimItem('aim_chest','Aim Ngực')}
                    ${renderAimItem('aim_co_v2','Aim Cổ')}
                    ${renderAimItem('aim_long_neck','Aim Cổ Dài')}
                </div>`;
            } else if(tab==='buyproxy'){
                html = `
                    <div style="width:100%;max-width:300px;margin:20px auto;text-align:center;color:#fff;">
                        <h4 style="font-family:'Orbitron';color:var(--cyan);text-shadow:0 0 30px var(--cyan);margin-bottom:20px;"><i class="fas fa-crown"></i> ${t('tab_buyproxy')}</h4>
                        <div style="background:rgba(0,0,0,0.6);padding:20px;border-radius:6px;border:1px solid rgba(255,0,0,0.5);text-align:center;box-shadow:0 0 30px rgba(255,0,0,0.3);">
                            <p style="font-size:14px;line-height:1.8;text-shadow:0 0 8px var(--cyan);">
                                📞 Liên hệ tiktok: <a href="https://www.tiktok.com/@username_amdau126" target="_blank" style="color:var(--cyan);text-decoration:underline;text-shadow:0 0 10px var(--cyan);">@user_amdau126</a>
                            </p>
                        </div>
                    </div>`;
            } else if(tab==='account'){
                let badge = accountRole==='admin'?'<span class="boss-icon">BOSS</span>':(accountRole==='mod'?'<span class="mod-icon">MOD</span>':'');
                let canChange = accountRole!=='mod';
                html=`<div style="width:100%;max-width:300px;margin:0 auto;">
                    <div style="text-align:center;margin-bottom:15px;">
                        <img id="accountAvatarImg" src="${defaultAvatar}" class="account-avatar-img">
                        <div style="font-size:11px;color:var(--cyan);margin-top:12px;text-shadow:0 0 15px var(--cyan);">[ BẤM ĐỂ ĐỔI ẢNH ]</div>
                    </div>
                    <div style="background:rgba(0,0,0,0.6);padding:14px;border-radius:6px;font-size:12px;margin-bottom:15px;border:1px solid rgba(255,0,0,0.5);box-shadow:inset 0 0 20px rgba(255,0,0,0.3), 0 0 20px rgba(255,0,0,0.4); color:#fff; text-shadow:0 0 5px var(--cyan);">
                        <div style="display:flex;justify-content:space-between;margin-bottom:10px;border-bottom:1px dashed rgba(255,0,0,0.2);padding-bottom:6px;align-items:center;">
                            <span style="color:var(--cyan);">Tài khoản:</span> 
                            <b ${canChange?'id="btnChangeName" style="cursor:pointer;color:var(--cyan);display:flex;align-items:center;text-shadow:0 0 10px var(--cyan);" title="Nhấn để đổi tên"':''}>${displayName} ${canChange?'<i class="fas fa-edit" style="font-size:10px;margin-left:6px;color:var(--cyan);text-shadow:0 0 10px var(--cyan);"></i>':''} ${badge}</b>
                        </div>
                        <div style="display:flex;justify-content:space-between;margin-bottom:10px;border-bottom:1px dashed rgba(255,0,0,0.2);padding-bottom:6px;"><span>Chức vụ:</span> <b style="color:var(--ff-orange);text-transform:uppercase;text-shadow:0 0 10px var(--ff-orange);">${accountRole}</b></div>
                        <div style="display:flex;justify-content:space-between;margin-bottom:10px;border-bottom:1px dashed rgba(255,0,0,0.2);padding-bottom:6px;"><span>Gói thẻ:</span> <b style="color:var(--cyan);text-transform:uppercase;text-shadow:0 0 10px var(--cyan);">${accountType}</b></div>
                        <div style="display:flex;justify-content:space-between;margin-bottom:10px;border-bottom:1px dashed rgba(255,0,0,0.2);padding-bottom:6px;"><span>IP:</span> <b class="live-ip-display">${clientIP}</b></div>
                        <div style="display:flex;justify-content:space-between;"><span>Thiết bị:</span> <b>${clientDevice}</b></div>
                    </div>
                    <button class="logout-btn" id="logoutButton"><i class="fas fa-sign-out-alt"></i> Đăng xuất</button>
                </div>`;
            } else if(tab==='settings'){
                html=`<div style="width:100%;max-width:300px;margin:0 auto;padding-top:5px; color:#fff;">
                    <h4 style="color:var(--cyan);text-shadow:0 0 30px var(--cyan);margin-bottom:25px;display:flex;align-items:center;gap:8px;font-family:'Orbitron';"><i class="fas fa-cog"></i> CÀI ĐẶT GIAO DIỆN</h4>
                    <div style="background:rgba(0,0,0,0.6);padding:15px;border-radius:6px;border:1px solid rgba(255,0,0,0.5);margin-bottom:15px;box-shadow:0 0 20px rgba(255,0,0,0.3);">
                        <label style="color:var(--cyan);text-shadow:0 0 10px var(--cyan);">Độ sáng: <span id="brightValText">${window.solBrightness}%</span></label>
                        <input type="range" id="brightSlider" min="20" max="150" value="${window.solBrightness}" style="width:100%;margin-top:8px;">
                    </div>
                    <div style="background:rgba(0,0,0,0.6);padding:15px;border-radius:6px;border:1px solid rgba(255,0,0,0.5);margin-bottom:15px;box-shadow:0 0 20px rgba(255,0,0,0.3);">
                        <label style="color:var(--cyan);text-shadow:0 0 10px var(--cyan);">Độ nháy Neon: <span id="neonValText">${window.solNeon}%</span></label>
                        <input type="range" id="neonSlider" min="0" max="300" value="${window.solNeon}" style="width:100%;margin-top:8px;">
                    </div>
                    <div style="background:rgba(0,0,0,0.6);padding:15px;border-radius:6px;border:1px solid rgba(255,0,0,0.5);margin-bottom:15px;box-shadow:0 0 20px rgba(255,0,0,0.3);">
                        <label style="color:var(--cyan);text-shadow:0 0 10px var(--cyan);">Tốc độ: <span id="speedValText">${window.solSpeed}s</span></label>
                        <input type="range" id="speedSlider" min="1" max="10" step="0.5" value="${window.solSpeed}" style="width:100%;margin-top:8px;">
                    </div>
                    <div style="display:flex;gap:10px;">
                        <div style="flex:1;text-align:center;background:rgba(0,0,0,0.6);padding:10px;border-radius:6px;border:1px solid rgba(255,0,0,0.5);box-shadow:0 0 20px rgba(255,0,0,0.3);">
                            <label style="color:var(--cyan);text-shadow:0 0 10px var(--cyan);">Màu Chủ Đạo</label>
                            <input type="color" id="primaryColorPicker" value="${window.solPrimaryColor}" style="width:100%;height:35px;border:none;background:transparent;">
                        </div>
                        <div style="flex:1;text-align:center;background:rgba(0,0,0,0.6);padding:10px;border-radius:6px;border:1px solid rgba(255,0,0,0.5);box-shadow:0 0 20px rgba(255,0,0,0.3);">
                            <label style="color:var(--cyan);text-shadow:0 0 10px var(--cyan);">Màu Phụ Đạo</label>
                            <input type="color" id="secondaryColorPicker" value="${window.solSecondaryColor}" style="width:100%;height:35px;border:none;background:transparent;">
                        </div>
                    </div>
                </div>`;
            }
        }
        contentDiv.innerHTML = html;
        if(!isLoggedIn && tab==='login'){
            document.getElementById('loginFormGame').onsubmit = async e => {
                e.preventDefault();
                const d = new URLSearchParams(new FormData(e.target));
                d.append('action','login'); d.append('csrf_token',csrf); d.append('device_id',solDeviceId); d.append('device_info',clientDevice);
                const r = await fetch('',{method:'POST',body:d}); const data = await r.json();
                if(data.s==='success') location.reload();
                else Swal.fire({icon:'error',title:'Lỗi Đăng Nhập',text:data.m,background:'#05020a',color:'#fff'});
            };
        }
        if(isLoggedIn){
            if(tab==='account'){
                document.getElementById('accountAvatarImg').onclick = ()=> document.getElementById('globalAvatarInput').click();
                const btn = document.getElementById('btnChangeName');
                if(btn) btn.onclick = ()=>{
                    Swal.fire({
                        title:'<span style="color:var(--cyan);text-shadow:0 0 10px var(--cyan);">ĐỔI TÊN HIỂN THỊ</span>',
                        input:'text', inputValue:displayName, inputAttributes:{maxlength:25},
                        showCancelButton:true, confirmButtonText:'LƯU', cancelButtonText:'HỦY',
                        background:'#05020a', color:'#fff',
                        customClass:{popup:'swal-sol-popup',confirmButton:'sol-btn-ok'}
                    }).then(async res=>{
                        if(res.isConfirmed && res.value.trim()!==''){
                            const fd = new URLSearchParams(); fd.append('action','change_name'); fd.append('csrf_token',csrf); fd.append('new_name',res.value.trim());
                            const r = await fetch('',{method:'POST',body:fd}); const d = await r.json();
                            if(d.s==='success'){ Swal.fire({icon:'success',title:'Thành công',timer:1500}); setTimeout(()=>location.reload(),1500); }
                            else { if(d.kick){ handleKick(); return; } Swal.fire({icon:'error',text:d.m,background:'#05020a',color:'#fff'}); }
                        }
                    });
                };
                document.getElementById('logoutButton').onclick = handleLogout;
            }
            if(tab==='aim'){
                document.querySelectorAll('.aim-card').forEach(card=>{
                    card.addEventListener('click', function(e){
                        if(e.target.tagName==='INPUT' || (e.target.tagName==='SPAN' && e.target.classList.contains('slider'))) return;
                        let id = this.getAttribute('data-id');
                        if(!this.classList.contains('disabled')) handleAimToggle(id);
                    });
                });
                document.querySelectorAll('.aim-switch-input').forEach(inp=> inp.addEventListener('change', function(){ handleAimToggle(this.dataset.id); }));

                const serverEl = document.getElementById('serverHostname');
                if(serverEl) {
                    serverEl.onclick = function(e) {
                        e.stopPropagation();
                        const domain = "solitudeteam.duckdns.org";
                        if (navigator.clipboard && navigator.clipboard.writeText) {
                            navigator.clipboard.writeText(domain).then(() => {
                                Swal.fire({icon:'success',title:'Đã copy tên máy chủ!',timer:1500,showConfirmButton:false});
                            }).catch(() => {
                                fallbackCopyText(domain);
                            });
                        } else {
                            fallbackCopyText(domain);
                        }
                    };
                }
            }
            if(tab==='settings'){
                document.getElementById('brightSlider').oninput = e=>{ window.solBrightness=e.target.value; document.getElementById('brightValText').innerText=e.target.value+'%'; document.body.style.filter=`brightness(${e.target.value}%)`; localStorage.setItem('sol_brightness',e.target.value); };
                document.getElementById('neonSlider').oninput = e=>{ window.solNeon=e.target.value; document.getElementById('neonValText').innerText=e.target.value+'%'; document.documentElement.style.setProperty('--neon-scale',e.target.value/100); localStorage.setItem('sol_neon',e.target.value); };
                document.getElementById('speedSlider').oninput = e=>{ window.solSpeed=e.target.value; document.getElementById('speedValText').innerText=e.target.value+'s'; document.documentElement.style.setProperty('--neon-speed',e.target.value+'s'); localStorage.setItem('sol_speed',e.target.value); };
                document.getElementById('primaryColorPicker').oninput = e=>{ window.solPrimaryColor=e.target.value; document.documentElement.style.setProperty('--cyan',e.target.value); localStorage.setItem('sol_primary',e.target.value); };
                document.getElementById('secondaryColorPicker').oninput = e=>{ window.solSecondaryColor=e.target.value; document.documentElement.style.setProperty('--purp',e.target.value); localStorage.setItem('sol_secondary',e.target.value); };
            }
        }
    }

    function fallbackCopyText(text) {
        const textarea = document.createElement('textarea');
        textarea.value = text;
        textarea.style.position = 'fixed';
        textarea.style.opacity = '0';
        document.body.appendChild(textarea);
        textarea.select();
        try {
            document.execCommand('copy');
            Swal.fire({icon:'success',title:'Đã copy tên máy chủ!',timer:1500,showConfirmButton:false});
        } catch (err) {
            Swal.fire({icon:'error',title:'Lỗi',text:'Không thể copy tự động.'});
        }
        document.body.removeChild(textarea);
    }

    async function handleAimToggle(id){
        if(window.isTogglingAim) return;
        window.isTogglingAim = true;
        let isTurningOn = (activeAim !== id);
        if(isTurningOn && activeAim !== null){
            Swal.fire({html:'...',background:'#05020a',customClass:{popup:'swal-sol-popup swal-sol-warning',confirmButton:'sol-btn-ok'}});
            window.isTogglingAim = false;
            return;
        }
        const fd = new URLSearchParams(); fd.append('action','toggle_aim'); fd.append('csrf_token',csrf); fd.append('aim_id',id); fd.append('state',isTurningOn?1:0); fd.append('client_ip',clientIP);
        Swal.fire({title:'Đang kết nối Server...',background:'#05020a',allowOutsideClick:false, didOpen:()=>Swal.showLoading()});
        try{
            const r = await fetch('',{method:'POST',body:fd}); const d = await r.json();
            if(d.kick){ handleKick(); return; }
            if(d.s==='error'){ Swal.fire({icon:'error',text:d.m}); switchTab('aim'); }
            else if(d.s==='cooldown'){
                let timerInterval;
                Swal.fire({
                    html: '<div class="neon-popup-content">⏳ VUI LÒNG CHỜ<br><span class="countdown-text" id="cooldownTimer">5</span><br>GIÂY</div>',
                    background: '#020106',
                    showConfirmButton: false,
                    allowOutsideClick: false,
                    timer: 5000,
                    timerProgressBar: true,
                    customClass: { popup: 'swal-sol-popup' },
                    didOpen: () => {
                        const timerEl = document.getElementById('cooldownTimer');
                        let seconds = 5;
                        timerInterval = setInterval(() => {
                            seconds--;
                            if (seconds >= 0) {
                                timerEl.textContent = seconds;
                            }
                        }, 1000);
                    },
                    willClose: () => {
                        clearInterval(timerInterval);
                        switchTab('aim');
                    }
                });
            }
            else if(d.s==='success'){
                if(isTurningOn){
                    activeAim = id; localStorage.setItem('sol_active_aim', id);
                    if(accountType==='free' && id==='no_antena') localStorage.setItem('sol_free_expire', Date.now()+3600000);
                    Swal.fire({
                        html: `<div class="neon-popup-content">✔️ ĐÃ KÍCH HOẠT<br><span class="neon-port-text">CỔNG: ${d.port}</span></div>`,
                        background: '#020106',
                        showConfirmButton: false,
                        timer: 3000,
                        customClass: { popup: 'swal-sol-popup' }
                    });
                } else {
                    activeAim = null; localStorage.removeItem('sol_active_aim');
                    if(id==='no_antena') localStorage.removeItem('sol_free_expire');
                    Swal.fire({icon:'success',title:'ĐÃ TẮT',toast:true,position:'top-end',timer:2500});
                }
                switchTab('aim');
            }
        } catch(e){ Swal.fire({icon:'error'}); switchTab('aim'); }
        window.isTogglingAim = false;
    }

    if(isLoggedIn){
        setInterval(async ()=>{
            const fd = new URLSearchParams(); fd.append('action','auth_check'); fd.append('csrf_token',csrf);
            const r = await fetch('',{method:'POST',body:fd}); const d = await r.json();
            if(d.kick) handleKick();
        },3000);
        setInterval(async ()=>{
            if(accountType==='free' && activeAim==='no_antena'){
                let exp = localStorage.getItem('sol_free_expire');
                if(exp && Date.now() > parseInt(exp)){
                    const fd = new URLSearchParams(); fd.append('action','toggle_aim'); fd.append('csrf_token',csrf); fd.append('aim_id','no_antena'); fd.append('state',0);
                    await fetch('',{method:'POST',body:fd});
                    activeAim=null; localStorage.removeItem('sol_active_aim'); localStorage.removeItem('sol_free_expire');
                    Swal.fire({icon:'warning',title:'HẾT GIỜ',text:'Thời gian sử dụng miễn phí (1 Giờ) kết thúc.'});
                    if(currentTab==='aim') switchTab('aim');
                }
            }
        },5000);
    }

    document.getElementById('globalAvatarInput').onchange = function(e){
        const file = e.target.files[0]; if(!file) return;
        const reader = new FileReader();
        reader.onload = async ev=>{
            const fd = new URLSearchParams(); fd.append('action','upload_avatar'); fd.append('csrf_token',csrf); fd.append('image',ev.target.result);
            const r = await fetch('',{method:'POST',body:fd}); const d = await r.json();
            if(d.kick){ handleKick(); return; }
            if(d.s==='success'){
                defaultAvatar = d.avatar;
                document.getElementById('miniAvatar')&&(document.getElementById('miniAvatar').src=defaultAvatar);
                document.getElementById('accountAvatarImg')&&(document.getElementById('accountAvatarImg').src=defaultAvatar);
                Swal.fire({icon:'success',title:'OK',text:'Đã đổi Avatar!',timer:1500});
            }
        };
        reader.readAsDataURL(file);
    };

    // Tự động mở modal
    const overlayEl = document.getElementById('gameModalOverlay');
    if (overlayEl) {
        overlayEl.classList.add('active');
        renderUserBar();
        switchTab(currentTab);
    }

    let currentScale = 1;
    document.getElementById('shrinkTextBtn').onclick = ()=>{
        Swal.fire({
            title:'<span style="color:var(--cyan);text-shadow:0 0 15px var(--cyan);">TÙY CHỈNH KÍCH THƯỚC</span>',
            html:`<div style="display:flex;justify-content:center;align-items:center;gap:25px;margin-top:20px;margin-bottom:20px;">
                <button id="btnZoomOut" style="width:50px;height:50px;font-size:18px;font-weight:bold;border-radius:6px;background:transparent;border:2px solid var(--pink);color:var(--pink);cursor:pointer;box-shadow:0 0 30px rgba(255,0,64,0.8);">A-</button>
                <span id="scaleDisplay" style="font-size:22px;font-weight:900;font-family:'Orbitron';color:var(--cyan);width:70px;text-shadow:0 0 20px var(--cyan);">100%</span>
                <button id="btnZoomIn" style="width:50px;height:50px;font-size:22px;font-weight:bold;border-radius:6px;background:transparent;border:2px solid var(--cyan);color:var(--cyan);cursor:pointer;box-shadow:0 0 30px rgba(255,0,0,0.8);">A+</button>
            </div>`,
            background:'#05020a', showConfirmButton:true, confirmButtonText:'ĐÓNG',
            customClass:{popup:'swal-sol-popup',confirmButton:'sol-btn-ok'},
            didOpen:()=>{
                const update = ()=>{ document.getElementById('scaleDisplay').innerText = Math.round(currentScale*100)+'%'; document.body.style.zoom = currentScale; };
                update();
                document.getElementById('btnZoomOut').onclick = ()=>{ if(currentScale>0.5){ currentScale-=0.1; update(); } };
                document.getElementById('btnZoomIn').onclick = ()=>{ if(currentScale<1.5){ currentScale+=0.1; update(); } };
            }
        });
    };
    </script>
</body>
