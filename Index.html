<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Premium Menu</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
</head>
<body>

    <div class="neon-wrapper">
        <!-- Thanh Tab Đỉnh Menu -->
        <div class="tab-control">
            <button class="tab-btn active" onclick="switchTab('info-tab')">THÔNG TIN</button>
            <button class="tab-btn" onclick="switchTab('main-tab')">MAIN MENU</button>
        </div>

        <div class="menu-content">
            <!-- TAB 1: THÔNG TIN -->
            <div id="info-tab" class="tab-pane active">
                <h2 class="neon-text-blue">HỒ SƠ MẠNG XÃ HỘI</h2>
                <p class="sub-text">Ấn vào để tự động mở ứng dụng hoặc liên kết profile</p>
                
                <div class="social-grid">
                    <a href="fb://profile/ngotansang11" target="_blank" class="social-card facebook" onclick="fallbackLink(event, 'https://facebook.com/ngotansang11')">
                        <div class="icon">f</div>
                        <div class="info">
                            <span>FACEBOOK</span>
                            <small>@ngotansang11</small>
                        </div>
                    </a>

                    <a href="snssdk1128://user/profile/username_amdau126" target="_blank" class="social-card tiktok" onclick="fallbackLink(event, 'https://www.tiktok.com/@username_amdau126')">
                        <div class="icon">♪</div>
                        <div class="info">
                            <span>TIKTOK</span>
                            <small>@username_amdau126</small>
                        </div>
                    </a>
                </div>
            </div>

            <!-- TAB 2: MAIN -->
            <div id="main-tab" class="tab-pane">
                <!-- Khối nhập Key -->
                <div id="auth-box" class="auth-container">
                    <h2 class="neon-text-pink">XÁC THỰC HỆ THỐNG</h2>
                    <div class="input-group">
                        <input type="text" id="key-input" placeholder="Nhập Key VIP tại đây...">
                        <button onclick="verifyKey()" class="btn-glow">XÁC NHẬN</button>
                    </div>
                    <p id="error-msg" class="error-text"></p>
                </div>

                <!-- Khối Thông tin Người dùng (Ẩn khi chưa nhập key) -->
                <div id="premium-dashboard" class="dashboard-container hidden">
                    <div class="premium-badge">PREMIUM USER</div>
                    <div class="user-meta">
                        <p><strong>Người dùng:</strong> <span id="user-display" class="neon-text-blue">VIP Member</span></p>
                        <p><strong>IP Thiết bị:</strong> <span id="ip-display">Đang tải...</span></p>
                    </div>

                    <!-- Khối hiển thị danh sách tài khoản -->
                    <h3 class="list-title">DANH SÁCH TÀI KHOẢN HỢP LỆ</h3>
                    <div id="account-list" class="account-grid">
                        <!-- Tài khoản tự động render ở đây -->
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Thông báo Toast khi Copy -->
    <div id="toast" class="toast-notification"></div>

    <script src="script.js"></script>
</body>
</html>
